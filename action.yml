name: "External Contribution Notify"
description: "Detects external contributions (PRs/Issues) on praetorian-inc repos — creates Linear issues, Slack notifications, and auto-reply comments"
author: "Praetorian"

inputs:
  linear-team-id:
    description: "Linear team ID for issue creation"
    required: true
  linear-project-id:
    description: "Linear project ID (optional)"
    required: false
  slack-channel-id:
    description: "Slack channel ID to post notification"
    required: true
  github-org:
    description: "GitHub organization to check membership against"
    required: false
    default: "praetorian-inc"
  linear-assignee-id:
    description: "Linear user ID to assign created issues to (optional)"
    required: false
  linear-parent-issue-id:
    description: "Linear parent issue ID — created issues become sub-issues of this parent (optional)"
    required: false
  linear-state-name:
    description: "Linear state name for created issues (defaults to Backlog)"
    required: false
    default: "Backlog"
  dry-run:
    description: "Log payloads instead of sending (for testing)"
    required: false
    default: "false"
  auto-reply-enabled:
    description: "Enable automatic reply comments on GitHub Issues/PRs (set false to disable)"
    required: false
    default: "true"

outputs:
  is-external:
    description: "Whether the contributor is external (true/false)"
  linear-issue-url:
    description: "URL of the created Linear issue (if created)"
  linear-issue-id:
    description: "Identifier of the created Linear issue (if created)"

runs:
  using: "node20"
  main: "dist/index.js"
